name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Both transports, every version. The claim is that the MCP path and
        # the direct path produce the same answers; a matrix is how that stays
        # true rather than how it was true once.
        transport: [direct, mcp]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements.txt

      # No secrets are configured for this workflow, and none are needed. The
      # suite stubs the language model, so a green run here is also proof that
      # a reviewer can clone and test without an API key. The structural
      # guards (one monthly_rate definition, no naive R/12, no upward import
      # from calculators/) are pytest assertions too - see tests/test_guards.py.
      - run: pytest -q
        env:
          CALCULATOR_TRANSPORT: ${{ matrix.transport }}
