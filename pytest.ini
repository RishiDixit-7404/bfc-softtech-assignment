; The suite lives in backend/. This exists so `pytest -q` works from the
; repository root as well as from inside backend/, since a reviewer will try the
; root first. `pythonpath` is what lets `import calculators` resolve without an
; editable install.
[pytest]
testpaths = backend/tests
pythonpath = backend
markers =
    subprocess: spawns the MCP server as a child process. Everything else in the suite runs in one interpreter with no I/O.
